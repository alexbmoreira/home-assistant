- id: '1741926711468'
  alias: Play Current Show on Plex
  description: ''
  triggers: []
  conditions: []
  actions:
  - action: script.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: script.open_plex
  - action: media_player.play_media
    data:
      media_content_type: EPISODE
