lights:
  card:
    type: vertical-stack
    cards:
      - type: custom:decluttering-card
        template: header
      - type: entities
        title: Living Room
        icon: mdi:sofa
        show_header_toggle: false
        entities:
          - type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_control: true
            entity: light.couch_lamp
            use_light_color: true
            collapsible_controls: false
            layout: horizontal
            icon: mdi:floor-lamp
          - type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: false
            layout: horizontal
            icon: phu:ikea-fado
            entity: light.globe_light
            fill_container: false
          - type: divider
          - type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: false
            layout: horizontal
            icon: mdi:lamps
            entity: light.living_room_lamps
          - type: divider
          - type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: false
            layout: horizontal
            icon: mdi:led-strip-variant
            entity: light.tv_leds
        card_mod:
          style: |
            ha-card {
              background: none;
              border: none;
            }
      - type: entities
        title: Kitchen
        icon: mdi:fridge
        show_header_toggle: false
